name: Build Linbeam (Go + Proton-GE)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Linux amd64 Binary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Unit Tests
        working-directory: linbeam-go
        run: go test -v ./...

      - name: Build static binary
        working-directory: linbeam-go
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/linbeam .
          chmod +x dist/linbeam

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: linbeam-linux-amd64
          path: linbeam-go/dist/linbeam
          if-no-files-found: error
